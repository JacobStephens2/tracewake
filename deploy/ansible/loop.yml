# Configure the Loop's box. Which host is the instance's inventory's business.
# Dry-run first:
#   ansible-playbook loop.yml --check --diff
#   ansible-playbook loop.yml            # apply
#
# Separate from site.yml, not a variant of it. site.yml configures the
# orchestration VM: one local Rocky 9 host whose roles install dnf repos, set
# SELinux fcontexts, and stand up Caddy, the status dashboard and the fleet's
# agent CLIs. None of that has an Ubuntu meaning, and none of it belongs on a
# box whose entire purpose is to hold as little as possible (spec issue #73).
# So this play has its own inventory group, reached over SSH, and its own small
# role set - which is what Single-User Factory ADR 0006 asks for.
#
# This play stops at: the box has the packages the Loop's own test suite needs,
# an unprivileged account for a Run to execute as, the Execution Boundary
# installed at a pinned version, a signing key generated on the box with git
# configured to use it, the agent at a pinned version, and the Loop's own
# scripts plus the checkout a Run works in.
#
# It stops short of all three credentials that arrive through a browser, which
# are the spec's human-only steps and are runnable walkthroughs rather than
# prose:
#   `sbx login`        wizards/loop-sbx-login.sh (#78)
#   the GitHub token,
#   and registering
#   the signing key    wizards/loop-github-credentials.sh (#81)
#   the agent's login  wizards/loop-claude-login.sh (#83)
- name: Configure the Loop's box
  hosts: loop
  gather_facts: true

  # THE agent swap, as one line. ADR 0004 makes the agent a variable rather than
  # a decision, and this is where that variable lives for the box: it chooses
  # which agent `loop_agent` installs for the login AND which host set
  # `loop_execution_boundary` allows through the egress proxy, so the two cannot
  # disagree about which vendor the box is set up for. The Loop's own half of the
  # swap is `LOOP_AGENT_COMMAND`, one line in run.sh, and nothing in the
  # Termination Contract moves for either (spec #73 user story 31).
  #
  # Overridable for a one-off, which is how #100's swap was demonstrated:
  #   ansible-playbook loop.yml -e loop_agent_name=grok
  vars:
    loop_agent_name: claude

  # A play-level guard, not a task inside the first role: it protects every role
  # below, and putting it in loop_base would make it depend on that role staying
  # first in the list.
  pre_tasks:
    - name: Refuse to run against anything but Ubuntu
      ansible.builtin.assert:
        that: ansible_facts.distribution == "Ubuntu"
        fail_msg: >-
          loop.yml is Ubuntu-only; this host reports
          {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
          The orchestration roles are the Rocky ones - see site.yml.

  # loop_account precedes the two roles below it so each can prove its tool runs
  # as the account a Run uses, rather than only as the root that installed it -
  # and, for the boundary, so there is an account to put in the `kvm` group.
  roles:
    - loop_base        # apt base package set (git, curl, jq, ca-certificates)
    - loop_account     # the unprivileged `loop` user a Run executes as
    - loop_shell_suite # bats + shellcheck, what the Loop's suite is written against
    - loop_execution_boundary # `sbx`, pinned - the hypervisor microVM an Iteration runs inside
    - loop_credentials # the signing key, generated here, and the git identity that uses it
    - loop_agent       # the agent named by loop_agent_name, pinned. On the host for the login and for the OAuth renewal (ADR 0017); a Run's work only ever runs inside the boundary
    - loop_scripts     # the Loop itself, and the checkout a Run works in
    # Last, and it has to be: it snapshots a template with `sbx` (the boundary
    # role) and proves it against the checkout (loop_scripts). Its smoke
    # assertion boots a real microVM and runs `composer install` in that
    # checkout, so an apply is a minute or two longer than it was - which is the
    # price of the play ENDING with a proof that a Run can run the suite,
    # rather than a Run being where that is discovered.
    - loop_guest_template # the PHP-capable guest an Iteration is built from (#164)
