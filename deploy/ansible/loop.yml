# Configure the Loop's box (loop.etadventures.com). Dry-run first:
#   ansible-playbook loop.yml --check --diff
#   ansible-playbook loop.yml            # apply
#
# Separate from site.yml, not a variant of it. site.yml configures the
# orchestration VM: one local Rocky 9 host whose roles install dnf repos, set
# SELinux fcontexts, and stand up Caddy, the status dashboard and the fleet's
# agent CLIs. None of that has an Ubuntu meaning, and none of it belongs on a
# box whose entire purpose is to hold as little as possible (spec issue #73).
# So this play has its own inventory group, reached over SSH, and its own small
# role set - which is what Single-User Factory ADR 0006 asks for.
#
# NOT covered here, deliberately, because each is its own ticket:
#   - the Loop's three credentials and the signing key generated on the box (#81)
#   - the Loop scripts themselves and their Termination Contract (#79)
# This play stops at: the box has the packages the Loop's own test suite needs,
# an unprivileged account for a Run to execute as, and the Execution Boundary
# installed at a pinned version. It does NOT log the boundary in - `sbx login`
# opens a browser, which is one of the spec's two human-only steps, and it is a
# runnable walkthrough instead: `lab/single-user-factory/wizards/loop-sbx-login.sh`.
- name: Configure the Loop's box
  hosts: loop
  gather_facts: true

  # A play-level guard, not a task inside the first role: it protects every role
  # below, and putting it in loop_base would make it depend on that role staying
  # first in the list.
  pre_tasks:
    - name: Refuse to run against anything but Ubuntu
      ansible.builtin.assert:
        that: ansible_facts.distribution == "Ubuntu"
        fail_msg: >-
          loop.yml is Ubuntu-only; this host reports
          {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
          The orchestration roles are the Rocky ones - see site.yml.

  # loop_account precedes the two roles below it so each can prove its tool runs
  # as the account a Run uses, rather than only as the root that installed it -
  # and, for the boundary, so there is an account to put in the `kvm` group.
  roles:
    - loop_base        # apt base package set (git, curl, jq, ca-certificates)
    - loop_account     # the unprivileged `loop` user a Run executes as
    - loop_shell_suite # bats + shellcheck, what the Loop's suite is written against
    - loop_execution_boundary # `sbx`, pinned - the hypervisor microVM an Iteration runs inside
