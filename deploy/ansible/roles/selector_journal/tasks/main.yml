# The Selector Journal's Postgres (ADR 0015): local instance, peer auth over
# the unix socket, zero credentials. The schema itself lives at
# selector/schema.sql and is idempotent.

- name: postgresql 16 server (module stream)
  ansible.builtin.dnf:
    name: "@postgresql:16/server"
    state: present
    disablerepo: 1password

- name: initdb (first build only)
  ansible.builtin.command: /usr/bin/postgresql-setup --initdb
  args:
    creates: /var/lib/pgsql/data/PG_VERSION

- name: unix socket only — no TCP listener
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    regexp: '^#?listen_addresses ='
    line: "listen_addresses = ''\t\t# unix socket only: peer auth, no TCP (ADR 0015)"
  notify: restart postgresql

- name: peer auth on the unix socket (pin the RHEL default the ADR relies on)
  ansible.builtin.lineinfile:
    path: /var/lib/pgsql/data/pg_hba.conf
    regexp: '^local\s+all\s+all\s'
    line: "local   all             all                                     peer"
  notify: restart postgresql

- name: postgresql enabled and started
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

# CREATEDB lets the shared test harness (selector/testdb.py) create and drop
# throwaway databases without superuser.
- name: conductor role, peer-auth, CREATEDB
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='conductor'" | grep -q 1
    && echo exists || createuser --createdb conductor
  register: journal_role
  changed_when: journal_role.stdout != 'exists'

- name: selector database owned by conductor
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -tAc "SELECT 1 FROM pg_database WHERE datname='selector'" | grep -q 1
    && echo exists || createdb -O conductor selector
  register: journal_db
  changed_when: journal_db.stdout != 'exists'

- name: journal schema applied (idempotent DDL)
  become: true
  become_user: conductor
  ansible.builtin.command: >
    psql -d selector -v ON_ERROR_STOP=1
    -f {{ srv_dir }}/selector/schema.sql
  changed_when: false
