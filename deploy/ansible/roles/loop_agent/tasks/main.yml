---
# Claude Code on the Loop's box, at a pinned version, with the login left to a
# human.
#
# Nothing here writes a credential. The subscription login opens a browser, so
# it is the spec's third human-only step and is a runnable walkthrough rather
# than prose: lab/single-user-factory/wizards/loop-claude-login.sh.

- name: What version of the agent the box is holding
  become: true
  become_user: loop
  ansible.builtin.command: "{{ loop_agent_claude_bin }} --version"
  register: loop_agent_installed
  changed_when: false
  failed_when: false

# Piped from the vendor's installer, which is how Claude Code is installed and
# the only way it is. Version-pinned by argument, and re-run only when the box
# is not already holding the pin - so an apply against a correct box is a no-op
# rather than a download.
#
# `warn` is not set and `creates:` is not used: the condition below is a version
# comparison, which is what a pin means, and `creates:` on the binary would make
# moving the pin a no-op.
- name: The agent, at the pinned version
  become: true
  become_user: loop
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl -fsSL https://claude.ai/install.sh
      | bash -s {{ loop_agent_claude_version }}
    executable: /bin/bash
  when: loop_agent_claude_version not in (loop_agent_installed.stdout | default(''))
  changed_when: true

- name: The box is holding the pinned version and not another one
  become: true
  become_user: loop
  ansible.builtin.command: "{{ loop_agent_claude_bin }} --version"
  register: loop_agent_version_check
  changed_when: false
  failed_when: loop_agent_claude_version not in loop_agent_version_check.stdout
  when: not ansible_check_mode

# The login is a human's. Its absence is worth naming once, where the operator
# is already looking, rather than being discovered by an unattended Run that
# builds a microVM and finds it has nothing to run inside it.
- name: Whether the human-only login has been done
  ansible.builtin.stat:
    path: "{{ loop_agent_credentials_path }}"
  register: loop_agent_credentials

- name: Say so if the agent has not been logged in
  ansible.builtin.debug:
    msg: >-
      No model credential at {{ loop_agent_credentials_path }}. The box can
      build a boundary and has nothing to run inside it. Run
      lab/single-user-factory/wizards/loop-claude-login.sh from the
      orchestration VM as conductor.
  when: not loop_agent_credentials.stat.exists
