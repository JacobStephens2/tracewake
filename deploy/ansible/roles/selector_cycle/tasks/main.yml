# What selector-cycle.service needs before the timer that starts it means
# anything: the interpreter it execs, correctly labelled.
#
# The unit and the timer themselves are not installed here - the `timers` role
# copies every scripts/*.service and scripts/*.timer wholesale and enables the
# ones named in `orchestration_timers`, and selector-cycle is on that list. A
# unit installed and NOT on it is silently inert, which is the failure gsc-etl
# sat in until 2026-08-08.
#
# The Journal this cycle appends to is `selector_journal`, which runs before
# this role in site.yml. The work checkout the dispatch seeds in is deliberately
# NOT created here: it commits as the operator, so making it is one `git clone`
# an operator runs once, written down in the Selector's README.

- name: selector venv + deps
  ansible.builtin.pip:
    requirements: "{{ srv_dir }}/selector/requirements.txt"
    virtualenv: "{{ srv_dir }}/selector/.venv"
    # The system interpreter, not 3.11 as status-dashboard pins. This is
    # what the live venv and the lab webapp's venv were both built with,
    # and the webapp imports the Selector's own modules - so a rebuild
    # that produced a different interpreter here would be the one place
    # the two halves of the Journal could disagree about their library.
    virtualenv_command: /usr/bin/python3 -m venv
  become: true
  become_user: conductor

# systemd execs this interpreter by path. Unlabelled it is var_t and the unit
# dies 203/EXEC with no traceback, which reads as "the Selector is quiet"
# rather than "the Selector cannot start". The fcontext rule itself is declared
# with the rest of them in roles/selinux_labels; this applies it to a directory
# that role's restorecon list does not cover because the venv is built here.
- name: label the venv bin_t so systemd can exec it
  ansible.builtin.command: >-
    restorecon -R {{ srv_dir }}/selector/.venv/bin
  changed_when: false
