---
# The PHP-capable guest template, built on the box and proved on the box.
#
# Two scripts and four tasks. The role deliberately holds almost no logic: the
# build's idempotence decision and the smoke assertion are both sequences with
# cleanup obligations, and each says what it does more clearly as a script with
# a trap than as six `command:` tasks and a `block`/`always`. What lives HERE is
# the recipe (defaults/main.yml) and the fact that a build is followed by a
# proof.
#
# Ordering in loop.yml: after `loop_execution_boundary`, which puts `sbx` on the
# box and chooses its egress posture, and after `loop_scripts`, which makes the
# checkout the smoke assertion installs into.

# The tag, from the file that makes the choice. `loop_agent` reads Grok's pin
# the same way and for the same reason, and its comment is the one that applies
# here too: two files pinning the same thing is exactly the drift a pin exists
# to prevent. Without this the role would build one tag while every Run built
# its boundary from another, and nothing anywhere would fail.
#
# `delegate_to: localhost` because the adapter this apply is SHIPPING is the
# controller's; the box's copy is whatever the last apply left. Not `become`,
# for the same reason - it is a local file read, and root has no part in it.
#
# `check_mode: false` so a dry run still resolves it. Every other command task
# in this role is correctly skipped under `--check`, but this one only reads,
# and skipping it leaves the tag undefined for every task below - a dry run that
# fails for a reason that has nothing to do with the box.
- name: The guest template the adapter builds its boundaries from
  ansible.builtin.command: "{{ loop_guest_template_adapter }} --guest-template"
  delegate_to: localhost
  become: false
  register: loop_guest_template_declared
  changed_when: false
  check_mode: false
  when: loop_guest_templates | default([]) | length == 0

- name: Name it once, so nothing below asks twice
  ansible.builtin.set_fact:
    loop_guest_template_tag: "{{ loop_guest_template_declared.stdout | trim if (loop_guest_template_declared is defined and loop_guest_template_declared.stdout is defined) else '' }}"
  when: loop_guest_templates | default([]) | length == 0

# An adapter that answered nothing would otherwise reach `sbx create -t ''`,
# which builds a sandbox from the vendor's default image - the stock guest, with
# no PHP - and the smoke assertion would then pass or fail for reasons that have
# nothing to do with the template. A named refusal beats either.
- name: Refuse an adapter that names no guest template
  ansible.builtin.assert:
    that: loop_guest_template_tag | length > 0
    fail_msg: >-
      {{ loop_guest_template_adapter }} answered nothing to --guest-template.
      That is the one place the image is declared, so there is nothing for this
      role to build or to prove.
  when: loop_guest_templates | default([]) | length == 0

- name: Somewhere for the template's own scripts to live
  ansible.builtin.file:
    path: "{{ loop_guest_template_dir }}"
    state: directory
    owner: loop
    group: loop
    mode: "0755"

- name: The build and the proof, as scripts on the box
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ loop_guest_template_dir }}/{{ item }}"
    owner: loop
    group: loop
    mode: "0755"
  loop:
    - build-guest-template.sh
    - smoke-guest-template.sh

- name: Determine declared templates to build
  ansible.builtin.set_fact:
    _loop_guest_templates_to_build: >-
      {{
        loop_guest_templates
        if (loop_guest_templates | default([]) | length > 0)
        else [
          {
            'tag': loop_guest_template_tag,
            'packages': loop_guest_template_packages,
            'agent': loop_guest_template_agent,
            'marker': loop_guest_template_marker,
            'smoke': true
          }
        ]
      }}

# The build decides for itself whether there is anything to do - the recipe
# recorded inside the image against the one declared here - so this task runs on
# every apply and is a no-op on a box already holding the right template. That
# is the same shape `loop_execution_boundary` uses for the egress reconcile, and
# for the same reason: a role that only acts on a REBUILT box leaves this one
# unconverged forever.
#
# `changed_when` on the script's own word rather than on its exit status. It
# exits 0 both when it built and when it found nothing to build, which is what
# makes it safe to run every time; the two are told apart by what it prints.
#
# Skipped under `--check`, like every command task in this play. Proof is an
# apply, and there is no dry run of building an image.
- name: Each guest template is built from its declared recipe
  become: true
  become_user: loop
  ansible.builtin.command:
    argv: >-
      {{ [loop_guest_template_dir ~ '/build-guest-template.sh',
          '--tag', item.tag,
          '--agent', item.agent | default(loop_guest_template_agent),
          '--marker', item.marker | default(loop_guest_template_marker),
          '--packages', item.packages | join(' '),
          '--allow', (item.build_egress | default(loop_guest_template_build_egress)) | map(attribute='host') | join(',')]
         + (['--verify', item.verify] if item.verify is defined else [])
         + (['--force'] if (item.rebuild | default(loop_guest_template_rebuild) | default(false) | bool) else []) }}
  loop: "{{ _loop_guest_templates_to_build }}"
  register: loop_guest_template_build
  changed_when: "'Built ' in loop_guest_template_build.stdout"

# The provisioning smoke assertion spec #151 asks for, run on every apply rather
# than only after a build. An image that was fine yesterday and cannot boot
# today is exactly what an unattended Run would discover at 03:00, and this is
# the cheapest place to discover it instead.
- name: A fresh guest from the template runs php, composer and the suite runner
  become: true
  become_user: loop
  ansible.builtin.command:
    argv:
      - "{{ loop_guest_template_dir }}/smoke-guest-template.sh"
      - --tag
      - "{{ item.tag }}"
      - --agent
      - "{{ item.agent | default(loop_guest_template_agent) }}"
      - --marker
      - "{{ item.marker | default(loop_guest_template_marker) }}"
      - --workspace
      - "{{ item.workspace | default(loop_guest_template_workspace) }}"
  loop: "{{ _loop_guest_templates_to_build | selectattr('smoke', 'defined') | selectattr('smoke') | list }}"
  register: loop_guest_template_smoke
  changed_when: false

# The assertion's own words, in the play's output. The task above passes or
# fails silently otherwise, and "which php, which Composer, which runner" is
# the thing an operator ran the apply to find out.
#
# `default([])` because under `--check` the command task above is skipped and
# registers no stdout - and a debug task that tracebacks is a dry run that
# fails for a reason that has nothing to do with the box.
- name: What the fresh guest answered
  ansible.builtin.debug:
    msg: "{{ loop_guest_template_smoke.results | map(attribute='stdout_lines') | list if (loop_guest_template_smoke is defined and loop_guest_template_smoke.results is defined) else (loop_guest_template_smoke.stdout_lines | default([])) }}"

