loop_account_user: loop
loop_account_home: /home/loop

# /dev/kvm is root:kvm 0660 on the stock image (recorded in
# lab/single-user-factory/notes/loop-droplet-evidence.md). The Execution
# Boundary boots a microVM per Iteration, so the account a Run executes as needs
# read/write on that device. Group membership is how it gets it - the
# alternative is running the boundary as root, which would make the whole
# unprivileged-account exercise pointless.
loop_account_groups: [kvm]
