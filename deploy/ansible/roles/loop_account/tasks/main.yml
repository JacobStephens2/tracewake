# The account a Run executes as. Unprivileged on purpose: the Loop's scripts run
# here and nothing in a Run needs root. There is deliberately NO sudoers entry -
# an unattended agent that can escalate is an unattended agent with no boundary
# worth the name, and the boundary is the one control Attendedness re-earns
# (ADR 0003).
#
# Also deliberately no authorized_keys: the operator reaches this account by
# SSHing to the box as root and running `su - loop`. Adding a key here would
# mean a second way in with nothing gained.
#
# Values are inline rather than in defaults/: there is one Loop, one box and one
# account, and the orchestration roles hardcode the same way (see
# conductor_account). A variable here would be a knob with one setting.
- name: The Loop's unprivileged account
  ansible.builtin.user:
    name: loop
    home: /home/loop
    shell: /bin/bash
    create_home: true

# 0750, not the Ubuntu default 0755. The box has no second login account today;
# this is so that adding one later is not silently a disclosure of whatever the
# Loop keeps in its home.
- name: The home is not world-readable
  ansible.builtin.file:
    path: /home/loop
    state: directory
    owner: loop
    group: loop
    mode: "0750"
