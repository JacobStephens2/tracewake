# `sbx` ships only from Docker's own apt repository - it is not in noble/universe
# like bats and shellcheck are - so the repository comes first.
# `curl` rather than `ansible.builtin.get_url`, which is what this should be and
# cannot be here: the orchestration VM runs ansible-core 2.14 on Python 3.9, and
# that release's HTTP modules call `HTTPSConnection(cert_file=...)`, a keyword
# Python 3.12 removed. The Loop's box IS Python 3.12 (Ubuntu 24.04), so get_url
# fails on it with `unexpected keyword argument 'cert_file'` before it reaches
# the network. Fixing that means upgrading ansible on the orchestration VM,
# which is a change to the box that configures the whole fleet - out of scope
# for this ticket and not worth risking for one file download. Revisit when
# ansible-core here reaches 2.16.
#
# `creates:` is the idempotence, and its limit is worth stating: the file is
# fetched once and never refreshed, so a key rotation at Docker's end leaves a
# stale key here. That fails loudly at the next `apt update` rather than
# silently, and the fix is to delete the file and re-apply.
- name: Inspect the existing boundary installation
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ loop_execution_boundary_apt_key_path }}"
    - /usr/bin/sbx
  register: loop_boundary_files

- name: Docker's apt signing key
  ansible.builtin.command:
    cmd: >-
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg
      -o {{ loop_execution_boundary_apt_key_path }}
    creates: "{{ loop_execution_boundary_apt_key_path }}"

- name: The signing key is readable by apt
  ansible.builtin.file:
    path: "{{ loop_execution_boundary_apt_key_path }}"
    mode: "0644"       # a+r, as the vendor's install script sets it: apt reads it unprivileged
    owner: root
    group: root
  when: not ansible_check_mode or loop_boundary_files.results[0].stat.exists

# The same one-line source `get.docker.com REPO_ONLY=1 sh` writes, and the same
# keyring path - but as a declared task rather than a piped shell script, so a
# re-apply is a comparison instead of a re-run. `signed-by` is templated from
# the variable above rather than repeating the literal, so the key task and this
# one cannot disagree about where the key is.
- name: Docker's apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by={{ loop_execution_boundary_apt_key_path }}]
      https://download.docker.com/linux/ubuntu noble stable
    filename: docker   # /etc/apt/sources.list.d/docker.sources, replacing nothing else
    state: present
    update_cache: true

# `install_recommends: false` is a deliberate departure from this play's other
# apt tasks, and the reason is measured rather than assumed. `docker-sbx` hard-
# depends on `gnome-keyring`, which drags in GTK 3 and 4. (It does not actually
# USE it here: on this headless box no keyring daemon is running, and `sbx`
# keeps the Docker session in encrypted files under
# ~loop/.config/com.docker.sandboxes instead - which is why the sign-in survives
# a reboot. The dependency is still hard, so it is still installed.) With
# recommends that is 115 packages - GStreamer, mesa Vulkan drivers, librsvg,
# three icon themes - on a box whose design property is holding as little as
# possible. Without them it is 69. The one recommend with a security argument,
# `apparmor`, is already present on the stock Ubuntu image, so nothing is given
# up:
#
#   # apt-get install -s docker-sbx=...            0 upgraded, 115 newly installed
#   # apt-get install -s --no-install-recommends   0 upgraded,  69 newly installed
#   # dpkg -l apparmor                             ii  4.0.1really4.0.1-0ubuntu0.24.04.7
#
# This task is also what MOVES the pin, and the two allow_* flags are what let
# it. They were added after watching the play fail without them, twice:
#
#   E: Packages were downgraded and -y was used without --allow-downgrades.
#   E: Held packages were changed and -y was used without --allow-change-held-packages.
#
# apt refuses both by default and ansible passes neither. Overriding the hold
# here is exactly right rather than a loophole: the hold exists to stop an
# unattended `apt upgrade` moving the boundary with no commit recording it, and
# this task is the commit. The hold is re-asserted immediately below.
- name: Install the Execution Boundary at its pinned version
  ansible.builtin.apt:
    name: "docker-sbx={{ loop_execution_boundary_sbx_version }}"
    state: present
    install_recommends: false
    allow_downgrade: true              # see the pin-move note below
    allow_change_held_packages: true
    update_cache: true
    cache_valid_time: 3600
  # A first check cannot see packages from the repository it would add.
  when: not ansible_check_mode or loop_boundary_files.results[0].stat.exists

# The pin above only decides what gets installed; this is what keeps it. Without
# a hold, `apt upgrade` - unattended-upgrades included - walks the box forward to
# whatever 0.x is current and the boundary changes underneath a Run with no
# commit anywhere recording it.
- name: Hold the pinned version against an unattended upgrade
  ansible.builtin.dpkg_selections:
    name: docker-sbx
    selection: hold
  when: not ansible_check_mode or loop_boundary_files.results[1].stat.exists

# #77 deliberately left this out, because whether the boundary needs it was
# #78's observation to make rather than this play's guess. It does: `sbx` boots a
# microVM through /dev/kvm, which is `root:kvm 0660`, and a Run executes as the
# unprivileged `loop` account. Group membership is the vendor's documented
# prerequisite ("User account in the kvm group") and is the whole of what `loop`
# gains - it is still not in sudo, and /dev/kvm is not a path to the host.
- name: The Loop's account can open /dev/kvm
  ansible.builtin.user:
    name: loop
    groups: kvm
    append: true

# Presence of a package is not presence of a working boundary. Ask the binary
# its version as the account a Run uses, which also proves the group membership
# above resolved. Not a proof that a sandbox *boots* - that needs `sbx login`,
# which is a browser step no play can take (see wizards/loop-sbx-login.sh).
#
# Skipped under --check, like every command task in this play. Proof is an apply.
- name: The boundary runs as the Loop's account
  ansible.builtin.command: sbx version
  become: true
  become_user: "{{ 'root' if ansible_check_mode else 'loop' }}"
  changed_when: false

# Everything above installs the boundary. Everything below is what supervises it
# across a reboot, which is a separate property and was missing: `docker-sbx`
# ships no unit (`dpkg -L docker-sbx | grep -i systemd` is empty), so nothing
# owned `sandboxd`. Issue #99.
#
# Read the header of files/sandboxd.service before changing any of this. It
# carries the argument and the evidence for it - in particular the thing that is
# easy to get wrong here, that the boundary does NOT need rescuing after a
# reboot.

# `loop` is uid 1000 on this box today only because it was the first account
# created. Derived rather than hardcoded, and held in one fact rather than
# repeated: the two variables below name the same runtime directory, and a
# second copy of the expression is a second place to be wrong.
- name: Read the Loop account's uid
  ansible.builtin.getent:
    database: passwd
    key: loop
    fail_key: false

- name: Name the Loop account's user-manager runtime directory
  ansible.builtin.set_fact:
    loop_execution_boundary_runtime_dir: "/run/user/{{ ansible_facts.getent_passwd['loop'][1] }}"
  when: ansible_facts.getent_passwd['loop'] is not none

# /etc/systemd/user, not ~loop/.config/systemd/user: the unit is ansible's to
# own, and a file under the account a Run executes as is a file that Run can
# rewrite.
#
# A change here has to reach the running daemon, or a re-apply reports `changed`
# and leaves the old definition in place - convergent on paper, not on the box.
# The handler restarts it, and the cost is worth stating plainly: an apply that
# edits this unit interrupts whatever the boundary is holding. Applies are an
# operator action, so that is the right trade, but do not run one against a box
# mid-Run.
- name: The daemon is a unit rather than a remembered command
  ansible.builtin.copy:
    src: sandboxd.service
    dest: /etc/systemd/user/sandboxd.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the boundary's daemon

# Without lingering, loop's user manager exists only while loop is logged in -
# and nobody logs in to this box. `enable-linger` is what starts it at boot, and
# it is the half of this ticket a unit file alone does not buy.
#
# `creates:` on the marker file systemd itself writes, rather than a shell
# conditional: `loginctl enable-linger` is idempotent, but a task that reports
# `changed` on every run is a task nobody reads.
- name: The Loop's user manager runs without a login
  ansible.builtin.command:
    cmd: loginctl enable-linger loop
    creates: /var/lib/systemd/linger/loop

# Enablement as a root-owned symlink, NOT `enabled: true` on the systemd task.
# They are not equivalent: `systemctl --user enable` writes the wants symlink
# into ~loop/.config/systemd/user/, under the account a Run executes as - so a
# Run could disable its own boundary and the next boot would come up without it.
# That would have made the comment on the copy task above only half true. This
# symlink is root's, in root's directory, and `loop` cannot remove it.
- name: The system-wide wants directory for user units exists
  ansible.builtin.file:
    path: /etc/systemd/user/default.target.wants
    state: directory
    owner: root
    group: root
    mode: "0755"
  # Not shipped by the distribution - `/etc/systemd/user` exists, this does not -
  # and `file: state=link` does not create a parent, so declaring it is the
  # difference between the link task working and failing with ENOENT.

- name: The unit is wanted at boot, by a link the Loop cannot remove
  ansible.builtin.file:
    path: /etc/systemd/user/default.target.wants/sandboxd.service
    src: /etc/systemd/user/sandboxd.service
    state: link
    owner: root
    group: root
  # `force: false` is the default and is wanted: this should fail rather than
  # clobber, if something else ever owns that path.
  when: not ansible_check_mode or loop_boundary_files.results[1].stat.exists

- name: No second enablement under the Loop's own home
  ansible.builtin.file:
    path: /home/loop/.config/systemd/user/default.target.wants/sandboxd.service
    state: absent

# Started, and therefore proven to parse and run, on every apply - rather than
# only asserted to be enabled. `systemctl is-enabled` would have passed for
# `certbot-renew.timer` on the orchestration VM for the whole time it was never
# running, and an expired certificate is how anyone found out.
#
# `scope: user` has to reach loop's user manager, and an ansible task is not a
# login session, so neither variable a login would have set is set. Without both
# the module fails at `daemon-reload` with `Failed to connect to bus: Operation
# not permitted` - which is what root asking for loop's bus looks like under
# `become`. XDG_RUNTIME_DIR alone is not enough: `systemctl --user` reads
# DBUS_SESSION_BUS_ADDRESS and does not derive it. Lingering above is what makes
# both exist when nobody is logged in, so the order of these tasks is load-
# bearing.
- name: The boundary's daemon is running
  ansible.builtin.systemd:
    name: sandboxd.service
    scope: user
    state: started
    daemon_reload: true
  become: true
  become_user: "{{ 'root' if ansible_check_mode else 'loop' }}"
  environment: "{{ loop_execution_boundary_user_manager_env }}"
  when: not ansible_check_mode

# A daemon that is up but has no egress profile is up and unusable: `sbx` has no
# implicit default and refuses to boot a sandbox until one is chosen. The choice
# survives a reboot - it is a sqlite database at
# ~loop/.cache/sandboxes/sandboxes/policykit/governor.db - so on a box already
# holding the right posture everything below is a read and a comparison.
#
# It does NOT survive a rebuild, and it lives under `~/.cache`, which is by
# convention the directory anything is free to delete. That is worth knowing and
# is not worth alarm: a boundary whose policy store is gone refuses to boot a
# sandbox rather than quietly widening, so the failure lands as a Run that does
# not start. This role is what puts it back.
#
# Everything from here to the end of the file is issue #100: moving the box off
# `balanced` and onto `deny-all` plus the allowlist declared in defaults. It is
# written as a reconcile rather than a one-time init because `sbx policy init`
# IS one-time per the CLI's own help - so a role that only guards on
# "has anything been chosen" moves a REBUILT box and does nothing whatever to
# this one, and a `deny-all` posture that only arrives on a rebuild is not the
# posture.
# The one lookup in this role that would fail as a traceback rather than a
# message. `loop_execution_boundary_egress_by_agent[...]` on a key that is not
# there is an undefined-variable error naming the expression, not the mistake.
# Everything else in this role fails loudly and says what is wrong; this makes
# that lookup do the same, and it runs first so nothing evaluates the map before
# it.
- name: The declared agent has a host set
  ansible.builtin.assert:
    that: loop_execution_boundary_agent in loop_execution_boundary_egress_by_agent
    fail_msg: >-
      loop_execution_boundary_agent is '{{ loop_execution_boundary_agent }}',
      which has no entry in loop_execution_boundary_egress_by_agent
      ({{ loop_execution_boundary_egress_by_agent.keys() | list | join(', ') }}).
      Declare its hosts there, each with a `need:` saying what breaks without it,
      before pointing the role at it.

# Ansible's sudo invocation can give sbx a terminal on stdin. On an
# uninitialized store that starts an interactive spinner instead of returning
# the error the guard below expects (observed hanging for over 3.5 hours).
# Read stdin from /dev/null so the fresh-box path fails immediately, while
# preserving stdout for posture parsing. The redirect requires `shell`.
- name: Read the boundary's current egress posture
  ansible.builtin.shell: sbx policy ls --json </dev/null
  become: true
  become_user: loop
  register: loop_execution_boundary_policy_state
  changed_when: false
  # The one command task in this role that runs under `--check`, and it has to.
  # Every other one is skipped there, correctly - proof is an apply. This one
  # only READS, and skipping it makes `--check` actively lie: with no output to
  # parse the posture reads as empty, so a box holding exactly the declared
  # allowlist is reported as holding none of it and about to be reset. A dry run
  # that says that is worse than no dry run.
  check_mode: false
  when: not ansible_check_mode or (loop_boundary_files.results[1].stat.exists and ansible_facts.getent_passwd['loop'] is not none)
  # The guard fails loudly rather than assuming: any exit that is neither
  # success nor the uninitialized message - a daemon that is not up, a reworded
  # message on the next pinned version - stops the play, instead of being read
  # as "no profile chosen" and silently resetting a policy store that was fine.
  failed_when: >-
    loop_execution_boundary_policy_state.rc != 0 and
    not loop_execution_boundary_policy_uninitialized

# One comparison, and the four tasks below hang off it. Separated from the
# `when:` on each so that the play SAYS what it thought was wrong before it
# resets a policy store - otherwise the next person reads a `changed` and has to
# reconstruct why.
#
# Counts and differences rather than both lists in full. The first version of
# this printed them, and against `balanced` that is 193 hosts in one `msg` -
# which buries the two lines that matter under a screen of wildcards nobody
# reads. `sbx policy ls --wide` on the box is where the full dump belongs.
- name: Report the egress posture against the declared one
  ansible.builtin.debug:
    msg:
      - "agent: {{ loop_execution_boundary_agent }}"
      - "declared: {{ loop_execution_boundary_egress_desired }}"
      - >-
        on the box: {{ loop_execution_boundary_egress_observed | length }} host(s),
        {{ loop_execution_boundary_egress_extra | length }} not declared
      - "declared but absent: {{ loop_execution_boundary_egress_missing }}"
      # Which of the three paths this apply is taking, in words, because the
      # difference between them is the difference between an interrupted Run
      # and an uninterrupted one. Each branch is one physical line: a Jinja
      # string literal split across lines keeps the newline, and `>-` does not
      # fold what is inside the quotes.
      - >-
        {{ 'a host has to be REMOVED, so the policy store is cleared and re-chosen - this stops the daemon and every sandbox it holds'
           if (loop_execution_boundary_policy_needs_reset | bool)
           else ('hosts are only being ADDED, on a live daemon, nothing stopped'
                 if (loop_execution_boundary_egress_to_allow | length > 0)
                 else 'nothing to do') }}
  changed_when: false

# Issue #72: without Docker sign-in `sbx policy init` waits indefinitely -
# ansible sat at "Choose the egress profile" with no error while `sbx`
# re-read the absent auth metadata. So before anything below touches the
# policy store, the play probes the sign-in state and fails promptly with the
# recovery step. This runs BEFORE the reset on purpose: clearing the store
# merely to discover nobody is signed in would destroy a posture that was
# fine, and recovery must never reset an existing store just to recover
# authentication.
#
# `sbx diagnose` is the signal because it reports authentication and daemon
# health independently - `sbx policy ls` on a fresh box answers "has not been
# initialized" even after a good login, so it cannot distinguish the two
# (see wizards/loop-sbx-login.sh stage 3). `failed_when: false` here because
# the assertion below owns the failure message; a diagnose that cannot run is
# read as "not signed in" by the same gate.
#
# The one command task besides the posture read that runs under `--check`,
# for the same reason: it only READS. Skipping it would let a dry run bless
# a box whose init is about to fail.
- name: Check the boundary's sign-in state before touching the policy store
  ansible.builtin.shell: sbx diagnose </dev/null
  become: true
  become_user: loop
  register: loop_execution_boundary_sbx_diagnose
  changed_when: false
  check_mode: false
  failed_when: false
  # Bounded like the init below it: a read that should return in seconds, and
  # a stall here must fail into the sign-in message rather than hold the play.
  # A timeout reads as "not signed in" through `failed_when: false` above.
  timeout: "{{ loop_execution_boundary_policy_init_timeout }}"
  when: >-
    (not ansible_check_mode or
     (loop_boundary_files.results[1].stat.exists and
      ansible_facts.getent_passwd['loop'] is not none))
    and (loop_execution_boundary_policy_needs_init | bool)

# Fails the play - before the reset, before the init - when the store needs
# choosing and nobody is signed in. On an already-initialized box with no
# drift this is skipped entirely: a lapsed sign-in there is not this role's
# to police, and failing would block applies that touch nothing.
- name: The boundary is signed in before the policy store is touched
  ansible.builtin.assert:
    that: loop_execution_boundary_sbx_authenticated | bool
    fail_msg: >-
      The Loop account is not signed in to Docker, so `sbx policy init`
      cannot proceed and the play is stopping instead of hanging. Sign in
      first by running wizards/loop-sbx-login.sh with LOOP_HOST set to this
      box (e.g. LOOP_HOST=<host> ./wizards/loop-sbx-login.sh), then re-apply.
      `sbx diagnose` on the box is the next read if the sign-in disagrees.
  when: >-
    (not ansible_check_mode or
     (loop_boundary_files.results[1].stat.exists and
      ansible_facts.getent_passwd['loop'] is not none))
    and (loop_execution_boundary_policy_needs_init | bool)

# `sbx policy init` refuses to run twice, so moving an already-initialized box
# means clearing the store first. This is the destructive step in the role and
# the reason applies are an operator action: `reset` stops the daemon and, with
# it, every sandbox it is holding. Do not run an apply against a box mid-Run.
#
# `--force` because there is no terminal to answer the confirmation prompt on.
#
# `shell` with the redirect, and NOT `command`, for a reason that cost a hung
# play to find. `sbx policy reset` stops the daemon and then auto-starts a
# replacement as its own child. That child inherits the task's stdout, ansible
# waits for the pipe to close, and the pipe never closes because the daemon does
# not exit:
#
#   6986  09:16  sbx policy reset --force     <- still "running" after 9 minutes
#   6997  09:16  /usr/bin/sbx daemon start    <- its child, holding the pipe open
#
# Sending the output to a file gives the orphan somewhere to hold that is not
# ansible's pipe. The exit status is still `reset`'s own, so a real failure
# still fails the task, and the log is on the box if one ever does.
#
# Only this task redirects output. Every other `sbx` command in this role runs
# with a daemon already up - the unit started it, or the restart below did - so
# none of them spawns anything. If these tasks are reordered, the posture read
# must stay after the task that guarantees a daemon is running: it needs stdout.
- name: Clear the policy store so the profile can be re-chosen
  ansible.builtin.shell: >-
    sbx policy reset --force
    </dev/null >{{ loop_execution_boundary_policy_reset_log }} 2>&1
  become: true
  become_user: "{{ 'root' if ansible_check_mode else 'loop' }}"
  when: not ansible_check_mode and loop_execution_boundary_policy_needs_reset | bool
  changed_when: true

# The task above leaves an UNSUPERVISED daemon behind, and this is what takes it
# back. That is not a guess about what might happen; it is what happened:
#
#   $ sbx policy reset --force        # "Daemon stopped successfully"
#   $ systemctl --user is-active sandboxd
#   inactive                          # Result=success, ExecMainStatus=0
#   $ ps -eo pid,user,cgroup,args | grep sbx
#   4104 loop 0::/user.slice/user-0.slice /usr/bin/sbx daemon start
#
# `reset` stops the daemon cleanly, so `Restart=on-failure` correctly does not
# fire and the unit goes inactive - and the CLI then auto-starts a replacement
# in whatever process tree invoked it, here root's session slice rather than the
# unit's cgroup. Restarting the unit at that point does NOT reclaim it: `sbx
# daemon start` prints `Daemon is already running`, exits 0, and the unit stays
# inactive while the stray daemon keeps running. This is exactly the hazard the
# header of files/sandboxd.service names, reached by an ordinary apply rather
# than by hand-starting anything.
#
# So: stop whatever is running, then let systemd start the one it supervises.
- name: Take the daemon back from the reset
  ansible.builtin.command: sbx daemon stop
  become: true
  become_user: "{{ 'root' if ansible_check_mode else 'loop' }}"
  when: loop_execution_boundary_policy_needs_reset | bool
  changed_when: true
  # Tolerant on purpose, and only here: if nothing is running there is nothing
  # to take back and the next task starts the supervised one regardless. This is
  # the one place a non-zero exit is not information.
  failed_when: false

- name: The supervised daemon is the one running
  ansible.builtin.systemd:
    name: sandboxd.service
    scope: user
    state: restarted
    daemon_reload: true
  become: true
  become_user: "{{ 'root' if ansible_check_mode else 'loop' }}"
  environment: "{{ loop_execution_boundary_user_manager_env }}"
  when: not ansible_check_mode and loop_execution_boundary_policy_needs_reset | bool

# Deny by default. On a rebuilt box this is the only one of these tasks that
# fires, because nothing has been chosen and the reset has nothing to clear.
#
# Bounded and stdin-detached (issue #72). The auth pre-check above is the fast
# path - it fails before this runs when nobody is signed in - and this is the
# backstop: `timeout` kills a stalled init after
# `loop_execution_boundary_policy_init_timeout` seconds so an unattended apply
# can never hang indefinitely, and `</dev/null` keeps `sbx` from seeing
# ansible's terminal and starting an interactive spinner instead of failing.
# `shell` rather than `command` for the redirect, the same reason the posture
# read above is `shell`.
- name: Choose the egress profile
  ansible.builtin.shell: "sbx policy init {{ loop_execution_boundary_policy_profile }} </dev/null"
  become: true
  become_user: "{{ 'root' if ansible_check_mode else 'loop' }}"
  when: loop_execution_boundary_policy_needs_init | bool
  changed_when: true
  timeout: "{{ loop_execution_boundary_policy_init_timeout }}"

# And then the allowlist, in one command rather than one per host: `sbx policy
# allow network` takes a comma-separated list and writes a separate rule per
# resource either way, so the rule ids are not something to depend on. That is
# why the comparison above is over the resources and not over rule names.
#
# What it is handed is the whole declared list after a reset and only the
# MISSING hosts otherwise - see the derivation in defaults. That is what makes
# adding a host cheap: no reset, no daemon stop, nothing interrupted, on a box
# whose posture is already narrow.
#
# Skipped, correctly, when there is nothing to add. A `deny-all` box with no
# allowlist is a legitimate posture, and `sbx policy allow network ""` is not a
# command.
- name: Allow exactly the hosts the agent needs
  ansible.builtin.command: >-
    sbx policy allow network
    {{ loop_execution_boundary_egress_to_allow | join(',') }}
  become: true
  become_user: "{{ 'root' if ansible_check_mode else 'loop' }}"
  when: loop_execution_boundary_egress_to_allow | length > 0
  changed_when: true
