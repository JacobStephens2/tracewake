# The Execution Boundary: Docker Sandboxes (`sbx`), one hypervisor microVM per
# Iteration. Single-User Factory ADR 0003 makes this the one subsystem
# Attendedness re-earns - nobody is watching a Run, so the boundary is the only
# control still standing.
#
# Pinned, not `latest`. `sbx` is a 0.x vendor tool shipping several releases a
# month (0.24 through 0.39 are all in the same apt suite), and a boundary that
# silently changes version between Runs is a boundary whose properties nobody
# has observed. Moving the pin is a one-line, reviewable commit; the apt hold in
# tasks/main.yml is what stops an unattended `apt upgrade` moving it instead.
loop_execution_boundary_sbx_version: 0.39.0-1~ubuntu.24.04~noble

# What this role does NOT give you, stated here because it is the property most
# likely to be inherited wrongly. The microVM, the separate kernel and the
# egress proxy are properties of the sandbox and hold for every agent. Host-
# proxy credential injection is NOT: it is keyed to a `sbx secret` service, and
# `sbx create --env` - the fallback for any agent without one - puts the value
# inside the VM where the agent can read it and send it to any of the 193 hosts
# the default `balanced` policy allows. Grok has no agent template here at all
# (`sbx create` offers claude, codex, copilot, cursor, docker-agent, droid,
# gemini, kiro, opencode, shell), though `xai` IS a supported secret service.
# The full statement, and the evidence under it, is in
# lab/single-user-factory/notes/loop-execution-boundary-evidence.md.

# The keyring path, because three tasks name it and the repository line embeds
# it - a second literal would drift silently the day one of them moved. The
# repository URL and the `deb` line itself are inline in tasks/main.yml, not
# here: loop_account states the convention this role follows, that a variable
# with one setting is a knob nobody turns. The version above and the profile
# below are the two real knobs in this role; this is neither.
loop_execution_boundary_apt_key_path: /etc/apt/keyrings/docker.asc

# The egress profile the boundary comes up on. `sbx` has no implicit default -
# on a box where nothing has chosen, `sbx policy ls` answers `global network
# policy has not been initialized` and a sandbox refuses to boot - so a daemon
# started by a unit at boot with nothing naming a profile is a boundary that is
# up and unusable. This is what names it.
#
# `balanced` is the vendor's middle setting and is NOT the right posture: it is
# 193 allowed hosts, 44 of them wildcards, and the evidence note records
# repositories reaching S3, GCS and githubusercontent from inside a sandbox. It
# is here because it is what the box already runs and because the narrowing -
# `deny-all` plus an explicit allowlist - belongs to the egress ticket, which
# will know which hosts the agent actually needs. Changing this line is how that
# ticket lands, and `sbx policy reset` is what lets it: `policy init` is
# one-time per the CLI's own help.
loop_execution_boundary_policy_profile: balanced

# Two derived values, here rather than repeated inline, because each is named in
# more than one task and a second copy is a second place to be wrong. Both are
# evaluated where they are used, not where they are written: the first needs the
# uid fact that tasks/main.yml reads, the second needs the command that task
# registers.
#
# The environment a `systemctl --user` task needs. XDG_RUNTIME_DIR alone is not
# enough - see the task's own comment for what failure that produces.
loop_execution_boundary_user_manager_env:
  XDG_RUNTIME_DIR: "{{ loop_execution_boundary_runtime_dir }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path={{ loop_execution_boundary_runtime_dir }}/bus"

# `sbx policy ls` on a box where nothing has chosen a profile answers `global
# network policy has not been initialized`, on stderr or stdout depending on the
# path it takes. Both are checked so the guard does not turn on which one.
loop_execution_boundary_policy_uninitialized: >-
  {{ 'has not been initialized' in
     (loop_execution_boundary_policy_state.stdout | default('') +
      loop_execution_boundary_policy_state.stderr | default('')) }}
