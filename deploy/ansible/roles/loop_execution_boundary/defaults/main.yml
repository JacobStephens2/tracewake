# The Execution Boundary: Docker Sandboxes (`sbx`), one hypervisor microVM per
# Iteration. Single-User Factory ADR 0003 makes this the one subsystem
# Attendedness re-earns - nobody is watching a Run, so the boundary is the only
# control still standing.
#
# Pinned, not `latest`. `sbx` is a 0.x vendor tool shipping several releases a
# month (0.24 through 0.39 are all in the same apt suite), and a boundary that
# silently changes version between Runs is a boundary whose properties nobody
# has observed. Moving the pin is a one-line, reviewable commit; the apt hold in
# tasks/main.yml is what stops an unattended `apt upgrade` moving it instead.
loop_execution_boundary_sbx_version: 0.39.0-1~ubuntu.24.04~noble

# What this role does NOT give you, stated here because it is the property most
# likely to be inherited wrongly. The microVM, the separate kernel and the
# egress proxy are properties of the sandbox and hold for every agent. Host-
# proxy credential injection is NOT: it is keyed to a `sbx secret` service, and
# `sbx create --env` - the fallback for any agent without one - puts the value
# inside the VM where the agent can read it and send it to any of the 193 hosts
# the default `balanced` policy allows. Grok has no agent template here at all
# (`sbx create` offers claude, codex, copilot, cursor, docker-agent, droid,
# gemini, kiro, opencode, shell), though `xai` IS a supported secret service.
# The full statement, and the evidence under it, is in
# lab/single-user-factory/notes/loop-execution-boundary-evidence.md.

# The keyring path, because three tasks name it and the repository line embeds
# it - a second literal would drift silently the day one of them moved. The
# repository URL and the `deb` line itself are inline in tasks/main.yml, not
# here: loop_account states the convention this role follows, that a variable
# with one setting is a knob nobody turns. The version above and the profile
# below are the two real knobs in this role; this is neither.
loop_execution_boundary_apt_key_path: /etc/apt/keyrings/docker.asc

# The egress profile the boundary comes up on. `sbx` has no implicit default -
# on a box where nothing has chosen, `sbx policy ls` answers `global network
# policy has not been initialized` and a sandbox refuses to boot - so a daemon
# started by a unit at boot with nothing naming a profile is a boundary that is
# up and unusable. This is what names it.
#
# `deny-all` since #100. It was `balanced` until then, deliberately: #78 wrote
# down the posture an operator gets by reflex rather than one tuned first, and
# that posture is 193 allowed hosts in six rules, 44 of them wildcards, through
# which a repository reaches S3, GCS and a public gist. `deny-all` plus the
# explicit allowlist below is what spec #73's user story 26 - "egress restricted
# to what the agent actually needs" - actually asks for.
#
# What `deny-all` does NOT narrow, stated here because the name oversells it: it
# is the NETWORK posture only. The filesystem rules survive it untouched -
# `default-fs-read-allow-all` and `default-fs-write-allow-all`, both `allow **`,
# are still there after an init. Inside the guest the agent still reads and
# writes anything; the microVM is what bounds that, not the policy.
loop_execution_boundary_policy_profile: deny-all

# Which agent's host set to allow alongside the common one. ADR 0004 makes the
# agent a variable rather than a decision, and this is the egress half of that:
# swapping to Grok (#84) is a change to this line plus a re-apply, not a rebuild
# - which is spec #73's user story 31.
loop_execution_boundary_agent: claude

# The allowlist, and the reason each entry is on it. Every host here was
# observed being reached from inside the boundary rather than reasoned about;
# the dump, the probes and the hosts deliberately left OFF are in
# lab/single-user-factory/notes/loop-execution-boundary-evidence.md, section
# "Narrowing to deny-all (issue #100)".
#
# `need` is not decoration. An allowlist whose entries carry no reason is one
# nobody can ever shorten, because removing a host means guessing what it was
# for. Adding a host here means writing what breaks without it.
#
# Ports are explicit. `sbx policy allow network github.com` would default to
# :443, but the rule it writes is then indistinguishable in a dump from one that
# meant something else, and this file is the only place the intent is recorded.
loop_execution_boundary_egress_common:
  - host: github.com:443
    need: >-
      git clone, fetch and push over HTTPS. The Iteration's whole repository
      interaction. Observed sufficient on its own: a shallow clone of a public
      repository completes with only this host allowed.
  - host: api.github.com:443
    need: >-
      `gh pr create`. The draft pull request is the Run's only external effect
      (Proposal-Only Output), so this is the one host the Run is FOR.

# Per-agent, keyed by loop_execution_boundary_agent. Keeping the two sets apart
# in the data - rather than in a comment on one merged list - is what makes the
# agent swap a configuration change: nothing has to be worked out by hand about
# which of the allowed hosts belonged to the agent that left.
loop_execution_boundary_egress_by_agent:
  # Empty, and that is a finding rather than an omission. `sbx`'s own `claude`
  # kit attaches a per-sandbox allow rule - `api.anthropic.com`,
  # `platform.claude.com`, `downloads.claude.ai`, `claude.com`,
  # `mcp-proxy.anthropic.com`, `bridge.claudeusercontent.com` - to every sandbox
  # `sbx create claude` makes, and that rule SURVIVES `policy init deny-all`:
  # scope `sandbox:<name>`, source `kit`, `editable: false`. Verified by probing
  # after the init - `api.anthropic.com` answered 404, the service, while
  # everything else in this file's "left off" list answered 403, the proxy.
  #
  # So Claude Code's inference hosts are the vendor's to declare and are already
  # narrower than anything written here would be. Duplicating them at global
  # scope would widen the boundary for EVERY sandbox, including a `shell` one,
  # to no benefit.
  claude: []

  # Grok Build has no kit - `sbx create` offers claude, codex, copilot, cursor,
  # docker-agent, droid, gemini, kiro, opencode and shell - so nothing declares
  # its hosts for it and they have to live here. ADR 0004 priced this in.
  #
  # Not yet verified against a Run; #84 is what does that. These come from the
  # shipped `grok` 1.0.5 binary on the orchestration VM rather than from a
  # vendor page, which is why the two that are here are here and the other four
  # it names are not - see the note's "left off" list.
  grok:
    - host: cli-chat-proxy.grok.com:443
      need: >-
        Inference on the subscription. The binary's default
        `GROK_CLI_CHAT_PROXY_BASE_URL` is https://cli-chat-proxy.grok.com/v1.
    - host: auth.x.ai:443
      need: >-
        The OIDC issuer in ~/.grok/auth.json. Grok's subscription credential is
        an auto-refreshing OAuth token, so this is needed for the refresh
        during a Run, not only at login.

# Four derived values, here rather than repeated inline, because each is named
# in more than one task and a second copy is a second place to be wrong. All are
# evaluated where they are used, not where they are written: they need the uid
# fact and the command output that tasks/main.yml produces.
#
# The environment a `systemctl --user` task needs. XDG_RUNTIME_DIR alone is not
# enough - see the task's own comment for what failure that produces.
loop_execution_boundary_user_manager_env:
  XDG_RUNTIME_DIR: "{{ loop_execution_boundary_runtime_dir }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path={{ loop_execution_boundary_runtime_dir }}/bus"

# `sbx policy ls` on a box where nothing has chosen a profile answers `global
# network policy has not been initialized`, on stderr or stdout depending on the
# path it takes. Both are checked so the guard does not turn on which one.
loop_execution_boundary_policy_uninitialized: >-
  {{ 'has not been initialized' in
     (loop_execution_boundary_policy_state.stdout | default('') +
      loop_execution_boundary_policy_state.stderr | default('')) }}

# The allowlist the box should be holding: the common set plus the current
# agent's, as bare `host:port` strings in a stable order. Sorted because the
# comparison below is between two lists and order is not part of the posture -
# without it, adding a host to the top of `_common` would read as drift.
loop_execution_boundary_egress_desired: >-
  {{ (loop_execution_boundary_egress_common +
      loop_execution_boundary_egress_by_agent[loop_execution_boundary_agent])
     | map(attribute='host') | sort }}

# The allowlist the box IS holding, read back from the daemon.
#
# `scope == 'global'` is the load-bearing filter and the reason this is not
# simply every network allow rule. A kit rule - the six Anthropic hosts `sbx`
# attaches to a `claude` sandbox - is also `layer: local`, but its scope is
# `sandbox:<name>` and it is `editable: false`. Counting it here would make the
# comparison below permanently unequal and the role would reset the policy store
# on every apply, once per sandbox that happens to exist.
#
# `resource_type == 'network'` drops the two filesystem rules, which `deny-all`
# does not touch and this role does not manage.
#
# The uninitialized branch is not defensive padding: on a box where nothing has
# chosen a profile, `sbx policy ls --json` prints the `has not been initialized`
# message rather than JSON, and `from_json` would fail on it. An uninitialized
# box holds no allowlist, so the honest answer is the empty one.
loop_execution_boundary_egress_observed: >-
  {{ [] if (loop_execution_boundary_policy_uninitialized | bool) else
     ((loop_execution_boundary_policy_state.stdout | default('{}', true) | from_json).rules | default([]))
     | selectattr('scope', 'eq', 'global')
     | selectattr('resource_type', 'eq', 'network')
     | selectattr('decision', 'eq', 'allow')
     | map(attribute='resources') | flatten | sort }}
