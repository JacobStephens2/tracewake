# Continuous deployment for the Tracewake Host.
#
# On every push to the default branch (which is how a merged pull request
# lands), check out that revision, SSH to the Host as root, and pipe
# deploy/cd-update.sh into a remote bash. Piping the pushed copy is what
# lets a Host whose checkout predates the script still converge; bash of
# the on-disk path is what failed with exit 127 (#105). The script then
# moves the checkout forward, refreshes dependencies and schema, and
# restarts the long-lived units. Full provisioning stays in
# deploy/ansible/host.yml.
#
# Required configuration (Settings > Secrets and variables > Actions).
# Nothing here names any particular host: the address is a fact about the
# instance being deployed, not about Tracewake, so it arrives as
# configuration like everything else.
#   TRACEWAKE_SSH_HOST (variable)  The Host to deploy: its DNS name or IP.
#   TRACEWAKE_SSH_KEY (secret)     Private ed25519 key whose public half is in
#                                  the Host's /root/.authorized_keys.
#   TRACEWAKE_SSH_KNOWN_HOSTS (secret)  Output of `ssh-keyscan $TRACEWAKE_SSH_HOST`,
#                                  verified against the Host's key fingerprint.
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: tracewake-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install the deploy SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.TRACEWAKE_SSH_KEY }}" > ~/.ssh/tracewake_deploy
          chmod 600 ~/.ssh/tracewake_deploy
          printf '%s\n' "${{ secrets.TRACEWAKE_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check out the pushed revision
        uses: actions/checkout@v4

      - name: Deploy to the Host
        run: |
          HOST="${{ vars.TRACEWAKE_SSH_HOST }}"
          if [ -z "$HOST" ]; then
            echo "TRACEWAKE_SSH_HOST is not set. Set the repository variable to" >&2
            echo "the CD target host (Settings > Secrets and variables > Actions" >&2
            echo "> Variables), or delete .github/workflows/deploy.yml if this" >&2
            echo "checkout is never deployed straight from GitHub." >&2
            exit 1
          fi
          ssh -i ~/.ssh/tracewake_deploy -o BatchMode=yes \
            "root@${HOST}" \
            'bash -s' < deploy/cd-update.sh
