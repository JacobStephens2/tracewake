<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Tracewake{% endblock %}</title>
<link rel="stylesheet" href="{{ static_base }}/app.css">
<script src="{{ static_base }}/htmx.min.js" defer></script>
</head>
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
{% include "_preview_banner.html" %}
<nav class="topnav">
  <a class="brand mono" href="/">tracewake</a>
  <span class="navlinks">
    <a href="/">board</a>
    <a href="/history">history</a>
    <a href="/adr">decisions</a>
    <a href="/site/index.html">lessons</a>
    {% include "_accounts_nav.html" %}
    {% if account %}
    <form method="post" action="{{ logout_url }}" class="sign-out">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">sign out</button>
    </form>
    {% endif %}
  </span>
</nav>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
