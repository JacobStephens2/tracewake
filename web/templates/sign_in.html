{% extends "base.html" %}
{% block title %}sign in — Tracewake{% endblock %}
{% block content %}
<header>
  <p class="eyebrow">the window</p>
  <h1>Sign in</h1>
  <p class="lede">The Journal is behind an account. There is no registration.</p>
</header>
<section class="card">
  {% if error %}
  <p class="form-error">{{ error }}</p>
  {% endif %}
  <form method="post" action="" class="sign-in">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>
      Email
      <input type="email" name="email" autocomplete="username" required autofocus>
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="demo-btn">Sign in</button>
  </form>
</section>
{% endblock %}
