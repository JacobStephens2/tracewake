# The targets file, as Educational Travel Adventures runs it.
#
# One `[[target]]` per repository this instance works. A second target is this
# stanza a second time - not a second controller, a second timer or a second
# Journal (issue #3). The target repository itself carries nothing about
# Tracewake: everything Tracewake needs to know about it is here.
#
# Required in every stanza: repo, work_repo, box_repo, token_file,
# guest_template, labeler_allowlist. Optional, with the defaults shown:
# labels (the four names below), landing = "propose", review_cap = 20.

[[target]]
# owner/name on the tracker.
repo = "Educational-Travel-Adventures/tourbot"

# The controller's own clone. Seeding happens here, as the operator, off the
# box (ADR 0010) - so this is a checkout the controller can push from.
work_repo = "/var/lib/conductor/selector-work/tourbot"

# The box's clone, which the Run works in. One level under $HOME on purpose:
# `sbx` mounts a workspace deeper than that as root, and every Iteration then
# writes as the wrong user.
box_repo = "/home/loop/tourbot"

# The fine-grained GitHub token for THIS repository and no other, on the box,
# readable only by the Run account. The blast radius of the whole arrangement
# is what this token can reach, so one per target is the invariant
# (ADR 0009, as amended).
token_file = "/home/loop/.config/loop/github-token"

# The `sbx` image each Iteration's microVM is built from: the vendor's, plus
# PHP and Composer, so a Run on a PHP codebase can run its own suite inside the
# boundary. Built on the box from a declared package list.
guest_template = "loop-php:1"

# Who may hand work over. The Handover IS the label (ADR 0014), so this is the
# whole of who is trusted to start a Run.
labeler_allowlist = ["JacobStephens2"]

# How many of this target's Proposals may sit in the review column before the
# Selector stops dispatching. A review-capacity bound rather than a spend one:
# the subscription is the money boundary, and what actually binds is how much
# output one reviewer can absorb.
review_cap = 20

# What a finished Run does with its work. `propose` is the only mode there is.
landing = "propose"

# The four labels this target's lifecycle runs on. Written out here because
# they are what an operator will look for on the tracker; they are also the
# defaults, so a target that uses these names may leave the table out.
[target.labels]
ready = "ready-for-agent"
needs_info = "needs-info"
review = "awaiting-review"
human = "ready-for-human"
